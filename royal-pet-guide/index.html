<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家牧院新生与升学规划助手</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --primary-bg: #EEF2FF;
            --accent: #F59E0B;
            --accent-light: #FDE68A;
            --success: #10B981;
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.25s ease;
        }
        [data-theme="dark"] {
            --primary: #818CF8;
            --primary-light: #A5B4FC;
            --primary-dark: #4F46E5;
            --primary-bg: #1E1B4B;
            --accent: #FBBF24;
            --bg-page: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: #334155;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ===== 标题栏 ===== */
        .header {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            padding: 18px 20px 14px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header h1 .emoji {
            font-size: 1.4rem;
        }
        .header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 400;
        }
        /* ===== 快捷问题 ===== */
        .quick-questions {
            padding: 14px 16px 8px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
        }
        .quick-questions::-webkit-scrollbar {
            display: none;
        }
        .quick-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            font-weight: 500;
        }
        .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }
        .quick-btn:active {
            transform: scale(0.96);
        }
        /* ===== 聊天区域 ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.bot {
            align-self: flex-start;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .message.user .avatar {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
        }
        .message.bot .avatar {
            background: linear-gradient(135deg, #F59E0B, #F97316);
            color: white;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.6;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .bubble p {
            margin-bottom: 8px;
        }
        .bubble p:last-child {
            margin-bottom: 0;
        }
        .bubble strong {
            color: var(--primary);
        }
        .message.bot .bubble strong {
            color: var(--primary);
        }
        .bubble .highlight {
            background: var(--accent-light);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .bubble .wechat-card {
            background: var(--primary-bg);
            border: 1.5px dashed var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bubble .wechat-card .icon {
            font-size: 1.6rem;
        }
        .bubble .wechat-card .info {
            flex: 1;
        }
        .bubble .wechat-card .info .label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .bubble .wechat-card .info .id {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .bubble .wechat-card .copy-btn {
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            border: none;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .bubble .wechat-card .copy-btn:hover {
            background: var(--primary-dark);
        }
        .bubble .wechat-card .copy-btn.copied {
            background: var(--success);
        }
        /* ===== 欢迎消息 ===== */
        .welcome-card {
            background: linear-gradient(135deg, var(--primary-bg), #FEF3C7);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-bottom: 4px;
        }
        .welcome-card .greeting {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .welcome-card h2 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .welcome-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .welcome-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }
        .welcome-card .tags .tag {
            padding: 4px 12px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        /* ===== 输入区域 ===== */
        .input-area {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--bg-page);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
            transition: var(--transition);
            outline: none;
        }
        .input-wrapper textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        /* ===== 打字动画 ===== */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .header h1 { font-size: 1.1rem; }
            .message { max-width: 96%; }
            .bubble { font-size: 0.85rem; padding: 10px 14px; }
            .quick-questions { padding: 10px 12px 6px; }
        }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <div class="header">
        <h1>
            <span class="emoji">🎓</span>
            皇家牧院 · 学长助手
            <span class="emoji">🐾</span>
        </h1>
        <p>新生入学 & 升学规划 · 专业热情学长在线解答</p>
    </div>
    <!-- 快捷问题 -->
    <div class="quick-questions" id="quickQuestions">
        <button class="quick-btn" data-q="宿舍">🏠 宿舍条件</button>
        <button class="quick-btn" data-q="食堂">🍜 食堂推荐</button>
        <button class="quick-btn" data-q="交通">🚌 交通出行</button>
        <button class="quick-btn" data-q="图书馆">📚 图书馆</button>
        <button class="quick-btn" data-q="快递">📦 快递地址</button>
        <button class="quick-btn" data-q="学费">💰 学费标准</button>
        <button class="quick-btn" data-q="专业前景">🎯 专业前景</button>
        <button class="quick-btn" data-q="录取分数线">📊 录取分数</button>
    </div>
    <!-- 聊天区域 -->
    <div class="chat-area" id="chatArea">
        <!-- 欢迎消息 -->
        <div class="welcome-card">
            <div class="greeting">👋 同学你好呀！</div>
            <h2>欢迎来到皇家牧院 🐾</h2>
            <p>
                我是你的专属学长助手！关于校园生活、宿舍食堂、交通出行、专业选择……<br>
                有任何问题都可以问我哦～ 有问必答！😊
            </p>
            <div class="tags">
                <span class="tag">🏠 宿舍</span>
                <span class="tag">🍜 食堂</span>
                <span class="tag">🚌 交通</span>
                <span class="tag">📚 学习</span>
                <span class="tag">🎯 升学</span>
                <span class="tag">💬 新生群</span>
            </div>
        </div>
    </div>
    <!-- 输入区域 -->
    <div class="input-area">
        <div class="input-row">
            <div class="input-wrapper">
                <textarea id="questionInput" placeholder="输入你想问的问题，比如「宿舍条件怎么样？」" rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    <script>
        // ===== 检测主题 =====
        const search = new URLSearchParams(location.search)
        if (search.get("colorScheme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark")
        }
        // ===== DOM 引用 =====
        const chatArea = document.getElementById("chatArea")
        const questionInput = document.getElementById("questionInput")
        const sendBtn = document.getElementById("sendBtn")
        const quickBtns = document.querySelectorAll(".quick-btn")
        // ===== 自动调整文本框高度 =====
        questionInput.addEventListener("input", () => {
            questionInput.style.height = "auto"
            questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px"
            sendBtn.disabled = !questionInput.value.trim()
        })
        // ===== 发送消息 =====
        async function sendMessage(question) {
            if (!question.trim()) return
            // 禁用输入
            questionInput.value = ""
            questionInput.style.height = "auto"
            sendBtn.disabled = true
            // 添加用户消息
            addMessage(question, "user")
            // 添加打字指示器
            const typingId = addTypingIndicator()
            try {
                const res = await fetch("/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                })
                const data = await res.json()
                // 移除打字指示器
                removeTypingIndicator(typingId)
                if (data.success) {
                    addMessage(data.answer, "bot")
                } else {
                    addMessage("😅 学长这边出了点小状况，请稍后再试哦～", "bot")
                }
            } catch (error) {
                removeTypingIndicator(typingId)
                addMessage("😅 网络开小差了，请稍后再试～", "bot")
            }
        }
        // ===== 添加消息 =====
        function addMessage(content, role) {
            const div = document.createElement("div")
            div.className = `message ${role}`
            const avatar = document.createElement("div")
            avatar.className = "avatar"
            avatar.textContent = role === "user" ? "👤" : "🎓"
            const bubble = document.createElement("div")
            bubble.className = "bubble"
            // 将内容中的换行转为 <br>，检测微信引导
            const formatted = content
                .replace(/\n/g, "<br>")
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            // 检测是否包含微信信息，如果有则渲染为卡片
            const wechatMatch = content.match(/huangjiamuyuan_xz/)
            if (wechatMatch) {
                bubble.innerHTML = formatted.replace(
                    /huangjiamuyuan_xz（皇家牧院小助）/g,
                    `<div class="wechat-card">
                        <div class="icon">💬</div>
                        <div class="info">
                            <div class="label">学长微信</div>
                            <div class="id">huangjiamuyuan_xz</div>
                        </div>
                        <button class="copy-btn" onclick="copyWechat(this)">复制微信号</button>
                    </div>`
                )
            } else {
                bubble.innerHTML = formatted
            }
            div.appendChild(avatar)
            div.appendChild(bubble)
            chatArea.appendChild(div)
            // 滚动到底部
            chatArea.scrollTop = chatArea.scrollHeight
        }
        // ===== 添加打字指示器 =====
        function addTypingIndicator() {
            const id = "typing_" + Date.now()
            const div = document.createElement("div")
            div.className = "message bot"
            div.id = id
            const avatar = document.createElement("div")
            avatar.className = "avatar"
            avatar.textContent = "🎓"
            const bubble = document.createElement("div")
            bubble.className = "bubble"
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">学长正在思考...</div>
            `
            div.appendChild(avatar)
            div.appendChild(bubble)
            chatArea.appendChild(div)
            chatArea.scrollTop = chatArea.scrollHeight
            return id
        }
        function removeTypingIndicator(id) {
            const el = document.getElementById(id)
            if (el) el.remove()
        }
        // ===== 复制微信号 =====
        window.copyWechat = function(btn) {
            const text = "huangjiamuyuan_xz"
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = "已复制 ✅"
                btn.classList.add("copied")
                setTimeout(() => {
                    btn.textContent = "复制微信号"
                    btn.classList.remove("copied")
                }, 2000)
            })
        }
        // ===== 发送按钮点击 =====
        sendBtn.addEventListener("click", () => {
            sendMessage(questionInput.value)
        })
        // ===== 回车发送 =====
        questionInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault()
                if (questionInput.value.trim()) {
                    sendMessage(questionInput.value)
                }
            }
        })
        // ===== 快捷问题点击 =====
        quickBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                sendMessage(btn.dataset.q)
            })
        })
    </script>
</body>
</html>
